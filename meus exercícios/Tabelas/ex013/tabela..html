<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        td{
            border: 1px solid black;
            padding: 9px;
        
           
        }
        table{
            width: 400px;
            border-collapse: collapse;
        }
        tr{
            border-collapse: collapse;
        }
        .tabela{
            background-color: brown;
        }
        .tb{
            background-color: aquamarine;
        }

       
    </style>
</head>
<body>
    <h1>primeira tabela</h1>

    <table>
        <tr>
            <td class="tabela">A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td class="tb">A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>

        
    </table>

</body>
</html>
