<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <div>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required placeholder="digite o seu nome" minlength="18" autocomplete="name">
        </div>

        <div>
            <label for="imed">Média</label>
            <input type="number" name="media" id="imed" required min="0" max="10" placeholder="0 a 10" step="0.1">
        </div>

        <div>
            <label for="imes">Periodo Lectivo</label>
            <input type="month" name="mes" id="imes">
        </div>

        <div>
            <label for="idate">Dia da prova</label>
           <input type="date" name="date" id="idate">
        </div>

        <div>
            <label for="itime">Horário da prova</label>
            <input type="time" name="time" id="itime">
        </div>

        <div>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">

        </div>




    </form>
    
</body>
</html>
